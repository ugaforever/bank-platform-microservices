global:
  domain: bank.local

  keycloak:
    issuerUri: "http://bank-keycloak:9002/realms/bank-realm"

  kafka:
     bootstrapServers: "bank-kafka:9092"

account-service:
  replicaCount: 1
  image:
    repository: bank-platform-microservices-account-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9005
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: account.bank.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  # Database connection details passed to account-service configmap
  config:
    database_url: "jdbc:postgresql://{{ .Release.Name }}-account-db:5432/accounts"
    database_username: "account_user"
    database_password_secret: "bank-account-db-secret"
    database_password_secret_key: "password"
  env:
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "{{ .Values.global.kafka.bootstrapServers }}"

cash-service:
  replicaCount: 1
  image:
    repository: bank-platform-microservices-cash-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9004
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: cash.bank.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  config:
    database_url: "jdbc:postgresql://{{ .Release.Name }}-cash-db:5432/cashes"
    database_username: "cash_user"
    database_password_secret: "bank-cash-db-secret"
    database_password_secret_key: "password"
  env:
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "{{ .Values.global.kafka.bootstrapServers }}"

transfer-service:
  replicaCount: 1
  image:
    repository: bank-platform-microservices-transfer-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9003
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: transfer.bank.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  config:
    database_url: "jdbc:postgresql://{{ .Release.Name }}-transfer-db:5432/transfers"
    database_username: "transfer_user"
    database_password_secret: "bank-transfer-db-secret"
    database_password_secret_key: "password"
  env:
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "{{ .Values.global.kafka.bootstrapServers }}"

notification-service:
  replicaCount: 1
  image:
    repository: bank-platform-microservices-notification-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9006
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: notification.bank.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  config:
    database_url: "jdbc:postgresql://{{ .Release.Name }}-notification-db:5432/notifications"
    database_username: "notification_user"
    database_password_secret: "bank-notification-db-secret"
    database_password_secret_key: "password"
  env:
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "{{ .Values.global.kafka.bootstrapServers }}"

account-db:
  enabled: true
  auth:
    database: accounts
    username: account_user
    existingSecret: bank-account-db-secret
  primary:
    persistence:
      enabled: true
      size: 1Gi

cash-db:
  enabled: true
  auth:
    database: cashes
    username: cash_user
    existingSecret: bank-cash-db-secret
  primary:
    persistence:
      enabled: true
      size: 1Gi

transfer-db:
  enabled: true
  auth:
    database: transfers
    username: transfer_user
    existingSecret: bank-transfer-db-secret
  primary:
    persistence:
      enabled: true
      size: 1Gi
    configuration: |
      wal_level = logical
      listen_addresses = '*'
      port = 5432

notification-db:
  enabled: true
  auth:
    database: notifications
    username: notification_user
    existingSecret: bank-notification-db-secret
  primary:
    persistence:
      enabled: true
      size: 1Gi

keycloak:
  external:
    enabled: true
    serviceName: bank-keycloak
    serviceType: ClusterIP
    port: 9002
    targetPort: 9002
#    hostIP: "192.168.10.197"
    # hostname: "keycloak.bank.local"
    annotations: {}

kafka:
  enabled: true
  topics:
    enabled: true

    list:
      - name: bank.notification
        partitions: 1
        replicationFactor: 1
        config: "cleanup.policy=compact,retention.ms=604800000"
      - name: bank.notification.dlt
        partitions: 1
        replicationFactor: 1
        config: "cleanup.policy=compact"
      - name: bank.transfer
        partitions: 1
        replicationFactor: 1
        config: "cleanup.policy=compact"
      - name: bank.transfer.dlt
        partitions: 1
        replicationFactor: 1
        config: "cleanup.policy=compact"

  controller:
    replicaCount: 1
  broker:
    replicaCount: 1

  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.5.1-debian-11-r25

  kraft:
    enabled: true
    clusterId: "5Lx7d9n6Qr2Rv5x8Yz3wXA"

  listeners:
    client:
      protocol: PLAINTEXT
      containerPort: 9092
    controller:
      protocol: PLAINTEXT
      containerPort: 9093

  advertisedListeners: "PLAINTEXT://bank-kafka:9092"

  persistence:
    enabled: true
    size: 10Gi

  zookeeper:
    enabled: false

  volumePermissions:
    enabled: false

keycloak-external:
  enabled: true
#  externalIP: 10.42.0.1  # IP хоста для Rancher Desktop
  service:
    name: bank-keycloak
    port: 9002

zipkin:
  enabled: true
  storage:
    type: mem
  service:
    port: 9411
    type: ClusterIP
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi

prometheus:
  enabled: true
  service:
    type: ClusterIP
    port: 9090

  prometheusSpec:
    retention: 7d
    retentionSize: "5GB"
    additionalScrapeConfigs:
      - job_name: 'account-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 15s
        static_configs:
          - targets: [ 'account-service:9005' ]
            labels:
              application: 'account-service'

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  alertmanager:
    enabled: true
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
  pushgateway:
    enabled: false

grafana:
  enabled: true

#  adminPassword: НЕ указываем явно. берем сгенерированный пароль из kubectl

  service:
    type: ClusterIP
    port: 3000

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://{{ .Release.Name }}-prometheus:9090
          access: proxy
          isDefault: true

  persistence:
    enabled: true
    size: 1Gi

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi