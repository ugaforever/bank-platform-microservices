  {{- if .Values.kafka.topics.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-topics
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ .Release.Name }}-kafka-topics
    spec:
      restartPolicy: Never
      containers:
        - name: topic-provisioner
          image: docker.io/bitnamilegacy/kafka:3.5.1-debian-11-r25
          command:
            - sh
            - -c
            - |
              set -e
              
              KAFKA_BOOTSTRAP="${SPRING_KAFKA_BOOTSTRAP_SERVERS:-bank-kafka:9092}"
              
              while ! kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list > /dev/null 2>&1; do
                sleep 5
              done
                            
              create_topic() {
                TOPIC="$1"
                PARTITIONS="${2:-1}"
                REPLICATION="${3:-1}"
                CONFIG="${4:-}"

                if kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list | grep -Fxq "$TOPIC"; then
                  echo "Topic $TOPIC already exists"
                else
                  echo "Creating topic: $TOPIC"

                  set -- kafka-topics.sh \
                    --bootstrap-server "$KAFKA_BOOTSTRAP" \
                    --create \
                    --topic "$TOPIC" \
                    --partitions "$PARTITIONS" \
                    --replication-factor "$REPLICATION"

                  if [ -n "$CONFIG" ]; then
                    echo "Config: $CONFIG"
                    OLD_IFS="$IFS"
                    IFS=','
                    for config_item in $CONFIG; do
                      set -- "$@" --config "$config_item"
                    done
                    IFS="$OLD_IFS"
                  fi
              
                  # Выполняем
                  "$@"
              
                  echo "Topic $TOPIC created successfully"
                fi
              }

              {{- range .Values.kafka.topics.list }}
              create_topic "{{ .name }}" "{{ .partitions }}" "{{ .replicationFactor }}" "{{ .config | default "" }}"
              {{- end }}
              
              echo "All topics created successfully!"
              echo "Current topics:"
              kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list
          volumeMounts:
            - name: topics-config
              mountPath: /config
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: topics-config
          configMap:
            name: {{ .Release.Name }}-kafka-topics-config
  {{- end }}