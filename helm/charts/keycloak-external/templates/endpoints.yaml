apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.service.name | default "keycloak" }}
  namespace: {{ .Release.Namespace }}
subsets:
  - addresses:
      - ip: {{ required "keycloak-external.externalIP is required when keycloak-external is enabled" .Values.externalIP | quote }}
    ports:
      - port: {{ .Values.service.port | default 9002 }}
        protocol: TCP
